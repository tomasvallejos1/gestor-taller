<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2c5f8f" />
    <title>Bobinados David</title>

    <!--
      La fuente, lo antes posible y en paralelo.

      preconnect abre la conexion TLS con los dos dominios de Google
      Fonts mientras todavia se esta bajando el HTML, asi que cuando el
      CSS de la fuente se pide, el handshake ya esta hecho. En una red
      movil eso son varios cientos de milisegundos antes del primer
      texto.

      Solo cuatro pesos: son los que el CSS usa. Cada peso de mas es un
      archivo de mas que baja un celular con señal mala.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
    />

    <!--
      vite-plugin-pwa inyecta el manifest.webmanifest solo. Lo que sigue
      es lo que el manifest NO cubre: Safari en iOS no lo lee para nada
      de esto, y usa en cambio estas etiquetas propias de Apple.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- El status bar transparente combina con el padding de
         safe-area-inset que ya tiene la barra inferior en index.css. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bobinados" />
  </head>
  <body>
    <script>
      // El tema se aplica antes de que React monte. Aplicarlo despues
      // tiene dos costos: la pagina pinta una vez en claro y salta, y
      // arranca una transicion sobre colores que dependen de variables
      // recien cambiadas --Chromium se queda mostrando el valor viejo y
      // el fondo queda claro con las tarjetas ya oscuras--.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.body.classList.add('dark-mode');
        }
      } catch (e) { /* localStorage bloqueado: queda en claro */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
